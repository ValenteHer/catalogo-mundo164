function resizeImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadCSV(filename, rows) {
  const esc = (v) => {
    const s = v === null || v === undefined ? "" : String(v);
    if (s.includes(",") || s.includes('"') || s.includes("\n")) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const csv = rows.map((row) => row.map(esc).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function fmtDate(d) {
  const dt = new Date(d);
  const dd = String(dt.getDate()).padStart(2, "0");
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const yy = dt.getFullYear();
  return `${dd}/${mm}/${yy}`;
}

  [/\bchrome\b/i, "Cromado"], [/\bsilver\b/i, "Plateado"], [/\bblack\b/i, "Negro"], [/\bwhite\b/i, "Blanco"],
  [/\bgold\b/i, "Dorado"], [/\bgild\b/i, "Dorado"], [/\bgr[ae]y\b/i, "Gris"], [/\bpurple\b/i, "Morado"],
  [/\bblue\b/i, "Azul"], [/\bred\b/i, "Rojo"], [/\bgreen\b/i, "Verde"], [/\byellow\b/i, "Amarillo"],
  [/\borange\b/i, "Naranja"], [/\bbronze\b/i, "Bronce"], [/\bcopper\b/i, "Bronce"], [/\bpink\b/i, "Rosado"],
  [/\bmud\b/i, "Marrón"], [/\bturquesa\b/i, "Turquesa"], [/\bgulf\b/i, "Gulf"], [/\bmanzana\b/i, "Verde manzana"],
];
function colorTagsOf(raw) {
  if (!raw) return [];
  const s = raw.trim();
  if (["NA", "N/A", "RANDOM", "VARIOS", ""].includes(s.toUpperCase())) return [];
  const tags = [];
  for (const [pat, es] of COLOR_MAP) if (pat.test(s) && !tags.includes(es)) tags.push(es);
  return tags;
}
const STANDARD_SIZES = [9, 9.8, 10, 10.3, 10.8, 11, 11.2, 12.7, 13, 14, 14.5, 15, 17];
function roundToStandardSize(n) {
  let best = STANDARD_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of STANDARD_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { best = s; bestDiff = d; }
  }
  return best;
}
function sizeTagOf(raw) {
  if (!raw) return null;
  const s = raw.trim();
  if (["NA", "VARIOS", "N/A", ""].includes(s.toUpperCase())) return null;
  if (!/mm/i.test(s)) return null;
  const pieces = s.split(/[+/,]/);
  const nums = [];
  for (const p of pieces) {
    const m = p.match(/(\d+\.?\d*)/);
    if (m) nums.push(m[1]);
  }
  if (nums.length === 0) return null;
  const fmt = (n) => { const f = roundToStandardSize(parseFloat(n)); return Number.isInteger(f) ? String(f) : String(Math.round(f * 100) / 100); };
  const seen = [];
  nums.forEach((n) => { const f = fmt(n); if (!seen.includes(f)) seen.push(f); });
  return seen.join("+") + "mm";
}
function brandTagOf(raw) {
  if (!raw) return null;
  const low = raw.trim().toLowerCase();
  if (["na", "n/a", "random", "", "no", "no logo"].includes(low) || low.includes("no logo")) return null;
  if (low.includes("good year") || low.includes("goodyear")) return "Goodyear";
  if (low.includes("toyo")) return "Toyo";
  if (low.includes("pirelli")) return "Pirelli";
  if (low.includes("bridgestone")) return "Bridgestone";
  if (low.includes("advan")) return "Advan";
  if (low.includes("bfgoodrich")) return "BFGoodrich";
  if (low.includes("dreamcar")) return "Dreamcar";
  if (low.includes("red lip")) return "Franja roja";
  if (low.includes("white lip")) return "Franja blanca";
  if (low.includes("brake disc")) return "Discos de freno";
  return null;
}

function FilterDropdown({ label, options, selected, onToggle, onRemove, swatches, openId, setOpenId }) {
  const id = label;
  const open = openId === id;
  const boxRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpenId(null); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open, setOpenId]);

  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div ref={boxRef} style={{ position: "relative" }}>
          <button onClick={() => setOpenId(open ? null : id)}
            style={{
              display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap",
              background: "#17171a", border: selected.length ? "1px solid #e2823c" : "1px solid #2a2a2e",
              borderRadius: 8, padding: "8px 12px", color: selected.length ? "#e2823c" : "#9a9994", fontSize: 12.5, fontWeight: 600,
            }}
          >
            {label}{selected.length > 0 ? ` (${selected.length})` : ""}
            <ChevronDown size={14} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
          </button>
          {open && (
            <div className="m164-scrollbar" style={{
              position: "absolute", top: "110%", left: 0, zIndex: 40, background: "#1a1a1c",
              border: "1px solid #2c2c30", borderRadius: 10, padding: 8, minWidth: 200, maxHeight: 260,
              overflowY: "auto", boxShadow: "0 10px 30px rgba(0,0,0,0.5)",
            }}>
              {options.length === 0 && <div style={{ fontSize: 12, color: "#7a7974", padding: 8 }}>Sin opciones</div>}
              {options.map((opt) => {
                const active = selected.includes(opt);
                return (
                  <label key={opt} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 8px", borderRadius: 6, cursor: "pointer", fontSize: 12.5, color: active ? "#e2823c" : "#e9e7e1" }}>
                    <input type="checkbox" checked={active} onChange={() => onToggle(opt)} style={{ accentColor: "#e2823c" }} />
                    {swatches && <span style={{ width: 10, height: 10, borderRadius: "50%", background: swatches[opt] || "#666", border: "1px solid rgba(255,255,255,0.25)", flexShrink: 0 }} />}
                    {opt}
                  </label>
                );
              })}
            </div>
          )}
        </div>
        {selected.map((opt) => (
          <span key={opt} style={{
            display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap",
            background: "rgba(226,130,60,0.15)", border: "1px solid #e2823c", color: "#e2823c",
            borderRadius: 999, padding: "5px 8px 5px 12px", fontSize: 12, fontWeight: 600,
          }}>
            {swatches && <span style={{ width: 9, height: 9, borderRadius: "50%", background: swatches[opt] || "#666", border: "1px solid rgba(255,255,255,0.4)" }} />}
            {opt}
            <button onClick={() => onRemove(opt)} style={{ background: "none", border: "none", color: "#e2823c", display: "flex", alignItems: "center", padding: 0 }}>
              <X size={13} />
            </button>
          </span>
        ))}
      </div>
    </div>
  );

}

function ClientCatalog({ products, overrides, cart, setCart, whatsapp, onSubmitOrder, logo }) {
  const [query, setQuery] = useState("");
  const [sizes_sel, setSizesSel] = useState([]);
  const [colors_sel, setColorsSel] = useState([]);
  const [brands_sel, setBrandsSel] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [openFilter, setOpenFilter] = useState(null);

  const toggleIn = (setter) => (val) => setter((arr) => arr.includes(val) ? arr.filter((v) => v !== val) : [...arr, val]);

  const sizes = useMemo(() => {
    const s = new Set(products.filter((p) => p.qty > 0).map((p) => p.sizeTag).filter(Boolean));
    return Array.from(s).sort((a, b) => parseFloat(a) - parseFloat(b));
  }, [products]);
  const colors = useMemo(() => {
    const s = new Set();
    products.filter((p) => p.qty > 0).forEach((p) => (p.colorTags || []).forEach((t) => s.add(t)));
    return Array.from(s).sort();
  }, [products]);
  const brands = useMemo(() => {
    const s = new Set(products.filter((p) => p.qty > 0).map((p) => p.brandTag).filter(Boolean));
    return Array.from(s).sort();
  }, [products]);

  const visible = useMemo(() => {
    return products.filter((p) => {
      if (sizes_sel.length > 0 && !sizes_sel.includes(p.sizeTag)) return false;
      if (colors_sel.length > 0 && !(p.colorTags || []).some((t) => colors_sel.includes(t))) return false;
      if (brands_sel.length > 0 && !brands_sel.includes(p.brandTag)) return false;
      if (!query.trim()) return true;
      const q = query.toLowerCase();
      return [p.code, p.name, p.diameter, p.color, p.logo].some((f) => (f || "").toLowerCase().includes(q));
    });
  }, [products, query, sizes_sel, colors_sel, brands_sel]);

  const cartCount = Object.values(cart).reduce((s, v) => s + v, 0);

  const addOne = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const removeOne = (id) => setCart((c) => {
    const next = { ...c, [id]: Math.max(0, (c[id] || 0) - 1) };
    if (next[id] === 0) delete next[id];
    return next;
  });
  const setQty = (id, qty) => setCart((c) => {
    const next = { ...c };
    if (qty <= 0) delete next[id]; else next[id] = qty;
    return next;
  });

  return (
    <>
      <Header view="client" cartCount={cartCount} onOpenCart={() => setCartOpen(true)} isAdmin={false} setView={() => {}} logo={logo} />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "16px" }}>
        <div style={{ position: "relative", marginBottom: 12 }}>
          <Search size={16} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#7a7974" }} />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="Buscar por código, nombre, color, medida..."
            style={{ width: "100%", background: "#17171a", border: "1px solid #2a2a2e", borderRadius: 10, padding: "10px 12px 10px 36px", color: "#f3f1ec", fontSize: 13.5 }}
          />
        </div>

        <FilterDropdown label="Tamaño" options={sizes} selected={sizes_sel} onToggle={toggleIn(setSizesSel)} onRemove={toggleIn(setSizesSel)} openId={openFilter} setOpenId={setOpenFilter} />
        <FilterDropdown label="Marca del caucho" options={brands} selected={brands_sel} onToggle={toggleIn(setBrandsSel)} onRemove={toggleIn(setBrandsSel)} openId={openFilter} setOpenId={setOpenFilter} />
        <FilterDropdown label="Color" options={colors} selected={colors_sel} onToggle={toggleIn(setColorsSel)} onRemove={toggleIn(setColorsSel)} openId={openFilter} setOpenId={setOpenFilter} swatches={COLOR_SWATCH} />

        {visible.length === 0 ? (
          <div style={{ textAlign: "center", padding: "60px 0", color: "#7a7974" }}>
            No encontramos productos con esa búsqueda.
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(155px, 1fr))", gap: 12 }}>
            {visible.map((p) => (
              <ProductCard
                key={p.id} product={p} photos={(overrides[p.id] && overrides[p.id].photos) || []}
                cartQty={cart[p.id] || 0} onAdd={() => addOne(p.id)} onRemove={() => removeOne(p.id)}
              />
            ))}
          </div>
        )}
      </div>
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} products={products} onQty={setQty} whatsapp={whatsapp}
        onSend={(items, total) => { onSubmitOrder(items, total); setCartOpen(false); }} />
    </>
  );
}

/* ---------------- Admin: Pedidos tab ---------------- */

function AdminPedidos({ orders, setOrders, clientes, setClientes }) {
  const [filter, setFilter] = useState("Todos");
  const [newClienteFor, setNewClienteFor] = useState(null);
  const [newClienteVal, setNewClienteVal] = useState("");

  const filtered = orders.filter((o) => filter === "Todos" ? true : o.status === filter).sort((a,b)=>b.createdAt-a.createdAt);

  const updateOrder = (id, patch) => {
    setOrders((prev) => {
      const next = prev.map((o) => o.id === id ? { ...o, ...patch } : o);
      const updated = next.find((o) => o.id === id);
      if (updated) fbSaveDoc("orders", id, updated);
      return next;
    });
  };

  const confirmClienteName = (orderId) => {
    const name = newClienteVal.trim();
    if (!name) return;
    if (!clientes.includes(name)) {
      const updated = [...clientes, name].sort();
      setClientes(updated);
      fbSaveDoc("meta", "clientes", { list: updated });
    }
    updateOrder(orderId, { cliente: name });
    setNewClienteFor(null); setNewClienteVal("");
  };

  const exportPagados = () => {
    const rows = [["Timestamp","Unidades","Nombre del cliente","Fecha de Pedido","Modelo","Tipo","Descuento","Comentario","Precio","ID Pedido"]];
    orders.filter((o) => o.status === "Pagado").forEach((o) => {
      o.items.forEach((it) => {
        rows.push([
          new Date(o.createdAt).toISOString(),
          it.qty,
          o.cliente || "",
          fmtDate(o.createdAt),
          `${it.code} ${it.diameter} ${it.name} ${it.logo} ${it.color}`.replace(/\s+/g," ").trim(),
          "Venta",
          o.discount || 0,
          `Pedido Web ${o.id}`,
          it.price,
          o.id,
        ]);
      });
    });
    downloadCSV(`pedidos_confirmados_${Date.now()}.csv`, rows);
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 6 }}>
          {["Todos","Pendiente","Pagado"].map((f) => (
            <button key={f} onClick={() => setFilter(f)} style={{
              padding: "6px 12px", borderRadius: 999, fontSize: 12.5, fontWeight: 600,
              border: filter === f ? "1px solid #e2823c" : "1px solid #2a2a2e",
              background: filter === f ? "rgba(226,130,60,0.15)" : "transparent",
              color: filter === f ? "#e2823c" : "#9a9994",
            }}>{f}</button>
          ))}
        </div>
        <button onClick={exportPagados} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <Download size={14} /> Exportar pagados (CSV)
        </button>
      </div>

      {filtered.length === 0 && <div style={{ color: "#7a7974", textAlign: "center", padding: "40px 0" }}>No hay pedidos en esta vista.</div>}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.map((o) => (
          <div key={o.id} style={{ background: "#151516", border: "1px solid #232326", borderRadius: 12, padding: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 12, color: "#7a7974" }}>{fmtDate(o.createdAt)} · #{o.id}</div>
                {o.cliente ? (
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{o.cliente}</div>
                ) : newClienteFor === o.id ? (
                  <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                    <input list="clientes-list" value={newClienteVal} onChange={(e) => setNewClienteVal(e.target.value)}
                      placeholder="Nombre del cliente" style={{ background: "#1f1f22", border: "1px solid #2a2a2e", borderRadius: 6, padding: "5px 8px", color: "#f3f1ec", fontSize: 12.5 }} />
                    <button onClick={() => confirmClienteName(o.id)} style={{ background: "#e2823c", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700 }}>OK</button>
                  </div>
                ) : (

function ImportExcelModal({ onClose, onImport }) {
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const fileRef = useRef(null);

  const norm = (s) => (s || "").toString().trim().toLowerCase();

  const handleFile = async (file) => {
    setError(""); setFileName(file.name);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (json.length === 0) { setError("El archivo no tiene filas de datos."); setRows([]); return; }

      const keyMap = {};
      Object.keys(json[0]).forEach((k) => {
        const nk = norm(k);
        if (nk.includes("codigo") || nk.includes("código")) keyMap.code = k;
        else if (nk.includes("diameter") || nk.includes("medida")) keyMap.diameter = k;
        else if (nk.includes("name") || nk.includes("nombre")) keyMap.name = k;
        else if (nk.includes("logo") || nk.includes("marca")) keyMap.logo = k;
        else if (nk.includes("color")) keyMap.color = k;
        else if (nk.includes("price") || nk.includes("precio")) keyMap.price = k;
        else if (nk.includes("quantity") || nk.includes("cantidad") || nk.includes("stock")) keyMap.qty = k;
      });

      if (!keyMap.code || !keyMap.name) {
        setError("No reconozco las columnas. Asegúrate de tener al menos Código y Name/Nombre.");
        setRows([]);
        return;
      }

      const parsed = json.map((r) => ({
        code: (r[keyMap.code] ?? "").toString().trim(),
        diameter: (r[keyMap.diameter] ?? "").toString().trim(),
        name: (r[keyMap.name] ?? "").toString().trim(),
        logo: (r[keyMap.logo] ?? "NA").toString().trim() || "NA",
        color: (r[keyMap.color] ?? "NA").toString().trim() || "NA",
        price: parseFloat(r[keyMap.price]) || 0,
        qty: parseInt(r[keyMap.qty]) || 0,
      })).filter((r) => r.code);

      setRows(parsed);
    } catch (e) {
      setError("No pude leer el archivo. Asegúrate de que sea un .xlsx válido.");
      setRows([]);
    }
  };

  const confirm = () => {
    onImport(rows);
    onClose();
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: "#141415", border: "1px solid #2a2a2e", borderRadius: 16, padding: 20, width: "min(600px,100%)", maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div className="disp" style={{ fontSize: 15, fontWeight: 700 }}>Importar productos desde Excel</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#9a9994" }}><X size={18} /></button>
        </div>

        {rows.length === 0 && (
          <>
            <div style={{ fontSize: 12, color: "#9a9994", marginBottom: 12, lineHeight: 1.5 }}>
              Sube un archivo .xlsx con columnas <b>Código, Diameter, Name, Logo, Color, Price, Quantity</b> (los nombres pueden variar un poco, ej. "Nombre" o "Precio" también funcionan).
            </div>
            <button onClick={() => fileRef.current.click()} style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, border: "1.5px dashed #3a3a3e", borderRadius: 10, padding: "28px", background: "transparent", color: "#9a9994" }}>
              <FileSpreadsheet size={26} />
              <span style={{ fontSize: 12.5 }}>{fileName || "Toca para elegir un archivo .xlsx"}</span>
            </button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }} onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
            {error && <div style={{ color: "#e08585", fontSize: 12, marginTop: 10 }}>{error}</div>}
          </>
        )}

        {rows.length > 0 && (
          <>
            <div style={{ fontSize: 12.5, color: "#3fae6a", marginBottom: 10 }}>{fileName} — {rows.length} productos listos para importar</div>
            <div className="m164-scrollbar" style={{ maxHeight: 280, overflowY: "auto", border: "1px solid #232326", borderRadius: 8, marginBottom: 14 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>
                <thead>
                  <tr style={{ position: "sticky", top: 0, background: "#1a1a1c" }}>
                    {["Código","Medida","Nombre","Logo","Color","Precio","Cant."].map((h) => (
                      <th key={h} style={{ padding: "6px 8px", textAlign: "left", color: "#9a9994", fontWeight: 600 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} style={{ borderTop: "1px solid #1d1d20" }}>
                      <td style={{ padding: "5px 8px", color: "#e2823c", fontWeight: 600 }}>{r.code}</td>
                      <td style={{ padding: "5px 8px" }}>{r.diameter}</td>
                      <td style={{ padding: "5px 8px" }}>{r.name}</td>
                      <td style={{ padding: "5px 8px" }}>{r.logo}</td>
                      <td style={{ padding: "5px 8px" }}>{r.color}</td>
                      <td style={{ padding: "5px 8px" }}>{money(r.price)}</td>
                      <td style={{ padding: "5px 8px" }}>{r.qty}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setRows([]); setFileName(""); }} style={{ flex: 1, background: "transparent", border: "1px solid #2a2a2e", color: "#9a9994", borderRadius: 8, padding: "10px", fontSize: 13 }}>Elegir otro archivo</button>
              <button onClick={confirm} style={{ flex: 1, background: "#e2823c", border: "none", color: "#0c0c0d", fontWeight: 700, borderRadius: 8, padding: "10px", fontSize: 13 }}>Importar {rows.length} productos</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function AdminProductos({ products, setAddedProducts, overrides, setOverrides }) {
  const [query, setQuery] = useState("");
  const [photoTarget, setPhotoTarget] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showImport, setShowImport] = useState(false);

  const visible = products.filter((p) => {
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return [p.code, p.name, p.diameter, p.logo, p.color].some((f) => (f || "").toLowerCase().includes(q));
  });

  const updateOverride = (id, patch) => {
    setOverrides((prev) => {
      const nextForId = { ...(prev[id] || {}), ...patch };
      fbSaveDoc("overrides", id, nextForId);
      return { ...prev, [id]: nextForId };
    });
  };

  const completeName = (p) => [p.code, p.diameter, p.name, p.logo, p.color].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();

  const exportNuevos = () => {
    const rows = [["Código","Diameter","Name","Logo","Color","Price","Quantity"]];
    products.filter((p) => p.isNew).forEach((p) => {
      const ov = overrides[p.id] || {};
      rows.push([p.code, p.diameter, p.name, p.logo, p.color, ov.price ?? p.price, ov.qty ?? p.qty]);
    });
    downloadCSV(`productos_nuevos_${Date.now()}.csv`, rows);
  };

  const th = { textAlign: "left", padding: "8px 10px", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", color: "#9a9994", borderBottom: "1px solid #2a2a2e", whiteSpace: "nowrap", background: "#151516", position: "sticky", top: 0 };
  const td = { padding: "6px 10px", fontSize: 12.5, borderBottom: "1px solid #1d1d20", color: "#e9e7e1", whiteSpace: "nowrap" };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
          <Search size={14} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#7a7974" }} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar producto..."
            style={{ width: "100%", background: "#17171a", border: "1px solid #2a2a2e", borderRadius: 8, padding: "8px 10px 8px 30px", color: "#f3f1ec", fontSize: 13 }} />
        </div>
        <button onClick={() => setShowNew(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#e2823c", border: "none", color: "#0c0c0d", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
          <Plus size={14} /> Nuevo producto
        </button>
        <button onClick={() => setShowImport(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <FileSpreadsheet size={14} /> Importar Excel
        </button>
        <button onClick={exportNuevos} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <Download size={14} /> Exportar nuevos
        </button>
      </div>
      <div style={{ fontSize: 11.5, color: "#7a7974", marginBottom: 10 }}>Mostrando {visible.length} de {products.length} productos. Precio y stock disponible se guardan al escribir — úsalo para corregir el inventario manualmente cuando agregues fotos o edites datos.</div>
      <div className="m164-scrollbar" style={{ overflowX: "auto", border: "1px solid #232326", borderRadius: 10, maxHeight: "70vh", overflowY: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 980 }}>
          <thead>
            <tr>
              <th style={th}>Foto</th>
              <th style={th}>CÓDIGO</th>
              <th style={th}>Diameter</th>
              <th style={th}>Name</th>
              <th style={th}>Logo</th>
              <th style={th}>Color</th>
              <th style={{ ...th, minWidth: 260 }}>Complete Name</th>
              <th style={th}>Price</th>
              <th style={th}>Stock disponible</th>
              <th style={th}>Fotos</th>
            </tr>
          </thead>
          <tbody>

              const ov = overrides[p.id] || {};

                    </div>
                  </td>
                  <td style={{ ...td, fontWeight: 700, color: "#e2823c" }}>{p.code}{p.isNew && <span style={{ color: "#3fae6a", fontSize: 9.5, marginLeft: 4 }}>nuevo</span>}</td>

                      <Upload size={12} /> {photos.length || 0}
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {photoTarget && (
        <ProductPhotosModal product={photoTarget} photos={(overrides[photoTarget.id] || {}).photos || []}
          onClose={() => setPhotoTarget(null)}
          onSave={(list) => { updateOverride(photoTarget.id, { photos: list }); setPhotoTarget(null); }} />
      )}

              price: form.price, qty: form.qty, category: "Otros", isNew: true,
              sizeTag: sizeTagOf(form.diameter), colorTags: colorTagsOf(form.color), brandTag: brandTagOf(form.logo),
            };
            setAddedProducts((prev) => [...prev, newProduct]);
            fbSaveDoc("added_products", id, newProduct);

            }));
            setAddedProducts((prev) => [...prev, ...newOnes]);
            newOnes.forEach((p) => fbSaveDoc("added_products", p.id, p));
          }} />
      )}
    </div>
  );
}

/* ---------------- Admin: Ajustes tab ---------------- */

function AdminAjustes({ settings, setSettings }) {
  const [local, setLocal] = useState(settings);
  const logoRef = useRef(null);

  const handleLogo = async (files) => {
    if (!files || !files[0]) return;
    const resized = await resizeImage(files[0], 300, 0.85);
    setLocal((l) => ({ ...l, logo: resized }));
  };

  return (
    <div style={{ maxWidth: 380 }}>
      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#9a9994", display: "block", marginBottom: 5 }}>Logo del catálogo</label>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 56, height: 56, borderRadius: "50%", background: "#000", border: "2px solid #e2823c", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            {local.logo ? <img src={local.logo} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 10, color: "#7a7974" }}>Sin logo</span>}
          </div>
          <button onClick={() => logoRef.current.click()} style={{ background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, display: "flex", alignItems: "center", gap: 6 }}>
            <Upload size={13} /> Subir logo
          </button>
          {local.logo && (
            <button onClick={() => setLocal((l) => ({ ...l, logo: null }))} style={{ background: "none", border: "none", color: "#9a9994", fontSize: 12 }}>Quitar</button>
          )}
        </div>
        <input ref={logoRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleLogo(e.target.files)} />
        <div style={{ fontSize: 11, color: "#7a7974", marginTop: 6 }}>Se recorta en círculo automáticamente. Recuerda presionar "Guardar ajustes" después de subirlo.</div>
      </div>
      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#9a9994", display: "block", marginBottom: 5 }}>Número de WhatsApp (con código de país, sin +)</label>
        <input value={local.whatsapp} onChange={(e) => setLocal((l) => ({ ...l, whatsapp: e.target.value }))}
          placeholder="584121234567" style={{ width: "100%", background: "#1f1f22", border: "1px solid #2a2a2e", borderRadius: 8, padding: "9px 10px", color: "#f3f1ec", fontSize: 13.5 }} />
      </div>
      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#9a9994", display: "block", marginBottom: 5 }}>PIN de administrador</label>
        <input value={local.pin} onChange={(e) => setLocal((l) => ({ ...l, pin: e.target.value }))}
          style={{ width: "100%", background: "#1f1f22", border: "1px solid #2a2a2e", borderRadius: 8, padding: "9px 10px", color: "#f3f1ec", fontSize: 13.5 }} />
      </div>
      <button onClick={() => { setSettings(local); fbSaveDoc("meta", "settings", local); }} style={{ background: "#e2823c", border: "none", color: "#0c0c0d", fontWeight: 700, borderRadius: 8, padding: "10px 16px", fontSize: 13 }}>
        Guardar ajustes
      </button>
      <div style={{ marginTop: 20, padding: 14, background: "#151516", border: "1px solid #232326", borderRadius: 10, fontSize: 12, color: "#9a9994", lineHeight: 1.5 }}>
        Los pedidos confirmados y los productos nuevos se exportan como CSV desde sus pestañas — úsalos para actualizar tu registro maestro de Ruedas Pedido.
      </div>
    </div>
  );
}

/* ---------------- Admin shell ---------------- */

function AdminView({ setView, orders, setOrders, clientes, setClientes, products, setAddedProducts, overrides, setOverrides, settings, setSettings, logo, onLogout }) {
  const [tab, setTab] = useState("pedidos");
  const pendCount = orders.filter((o) => o.status === "Pendiente").length;
  return (
    <>
      <Header view="admin" isAdmin={true} setView={setView} cartCount={0} onOpenCart={() => {}} logo={logo} />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "16px" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 16, borderBottom: "1px solid #232326", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", gap: 6 }}>
          {[["pedidos","Pedidos",ClipboardList,pendCount],["productos","Productos",Package,0],["ajustes","Ajustes",Settings,0]].map(([id,label,Icon,badge]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "10px 14px", background: "none", border: "none",
              borderBottom: tab === id ? "2px solid #e2823c" : "2px solid transparent",
              color: tab === id ? "#e2823c" : "#9a9994", fontSize: 13, fontWeight: 600,
            }}>
              <Icon size={15} /> {label}
              {badge > 0 && <span style={{ background: "#e2823c", color: "#0c0c0d", fontSize: 10.5, fontWeight: 700, borderRadius: 999, padding: "1px 6px" }}>{badge}</span>}
            </button>
          ))}
          </div>
          <button onClick={onLogout} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "1px solid #2c2c30", color: "#9a9994", borderRadius: 8, padding: "7px 12px", fontSize: 12, marginBottom: 8 }}>
            <LogOut size={13} /> Cerrar sesión
          </button>
        </div>
        {tab === "pedidos" && <AdminPedidos orders={orders} setOrders={setOrders} clientes={clientes} setClientes={setClientes} />}
        {tab === "productos" && <AdminProductos products={products} setAddedProducts={setAddedProducts} overrides={overrides} setOverrides={setOverrides} />}
        {tab === "ajustes" && <AdminAjustes settings={settings} setSettings={setSettings} />}
      </div>
    </>
  );
}

/* ---------------- Root App ---------------- */

function App() {
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("client");
  const [showGate, setShowGate] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);

  const [addedProducts, setAddedProducts] = useState([]);
  const [overrides, setOverrides] = useState({});
  const [orders, setOrders] = useState([]);
  const [clientes, setClientes] = useState(SEED_CLIENTES);
  const [settings, setSettings] = useState({ whatsapp: "", pin: "1234", logo: null });
  const [cart, setCart] = useState({});
  const [toast, setToast] = useState(null);

  useEffect(() => {
    (async () => {
      const [addedMap, overridesMap, ordersMap, clientesDoc, settingsDoc] = await Promise.all([
        fbFetchCollection("added_products"),
        fbFetchCollection("overrides"),
        fbFetchCollection("orders"),
        fbFetchDoc("meta", "clientes", { list: SEED_CLIENTES }),
        fbFetchDoc("meta", "settings", { whatsapp: "", pin: "1234", logo: null }),
      ]);
      setAddedProducts(Object.values(addedMap));
      setOverrides(overridesMap);
      setOrders(Object.values(ordersMap));
      setClientes(clientesDoc.list || SEED_CLIENTES);
      setSettings(settingsDoc);
      setLoaded(true);
    })();
  }, []);

  const allProducts = useMemo(() => {
    const merged = [...SEED_PRODUCTS, ...addedProducts].map((p) => {
      const ov = overrides[p.id];
      if (!ov) return p;
      return { ...p, price: ov.price ?? p.price, qty: ov.qty ?? p.qty };
    });
    return merged;
  }, [addedProducts, overrides]);

  const submitOrder = (items, total) => {
    const order = {
      id: "P" + Date.now().toString().slice(-8),
      createdAt: Date.now(),
      status: "Pendiente",
      discount: 0,
      cliente: "",
      total,
      items: items.map(({ product, qty }) => ({ id: product.id, code: product.code, diameter: product.diameter, name: product.name, logo: product.logo, color: product.color, price: product.price, qty })),
    };
    fbSaveDoc("orders", order.id, order);
    setOrders((prev) => [...prev, order]);
    setCart({});

    const lines = items.map(({ product, qty }) => `• ${qty}x ${product.code} ${product.name}${product.color && product.color.toUpperCase()!=="NA" ? " ("+product.color+")" : ""} — ${money(product.price*qty)}`);
    const text = `*Pedido Mundo 1/64* #${order.id}\n\n${lines.join("\n")}\n\n*Total: ${money(total)}*\n\nEstado: pendiente de confirmación de pago.`;
    const phone = (settings.whatsapp || "").replace(/\D/g, "");
    const url = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, "_blank");
    setToast("¡Pedido enviado! Revisa WhatsApp para confirmarlo.");
    setTimeout(() => setToast(null), 4000);
  };

  if (!loaded) {
    return (
      <div className="m164" style={{ minHeight: 400, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <BrandStyles />
        <div style={{ color: "#9a9994", fontSize: 13 }}>Cargando catálogo...</div>
      </div>
    );
  }

  return (
    <div className="m164" style={{ minHeight: 400, paddingBottom: 30 }}>
      <BrandStyles />
      {view === "client" ? (
        <>
          <ClientCatalog products={allProducts} overrides={overrides} cart={cart} setCart={setCart} whatsapp={settings.whatsapp} onSubmitOrder={submitOrder} logo={settings.logo} />
          <div style={{ textAlign: "center", padding: "18px 0" }}>
            <button onClick={() => setShowGate(true)} style={{ background: "none", border: "none", color: "#4a4a4d", fontSize: 11 }}>Acceso administrador</button>
          </div>
        </>
      ) : (
        <AdminView setView={setView} orders={orders} setOrders={setOrders} clientes={clientes} setClientes={setClientes}
          products={allProducts} setAddedProducts={setAddedProducts} overrides={overrides} setOverrides={setOverrides}
          settings={settings} setSettings={setSettings} logo={settings.logo}
          onLogout={() => { setIsAdmin(false); setView("client"); }} />
      )}
      {showGate && (
        <AdminGate pin={settings.pin} onCancel={() => setShowGate(false)} onSuccess={() => { setIsAdmin(true); setView("admin"); setShowGate(false); }} />
      )}
      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#1f1f22", border: "1px solid #e2823c", color: "#f3f1ec", padding: "12px 20px", borderRadius: 10, fontSize: 13, zIndex: 70, boxShadow: "0 6px 20px rgba(0,0,0,0.4)" }}>
          {toast}
        </div>
      )}
      {isAdmin && view === "client" && (
        <div style={{ position: "fixed", bottom: 16, left: 16, zIndex: 40 }}>
          <button onClick={() => setView("admin")} style={{ background: "#1a1a1c", border: "1px solid #2c2c30", color: "#e2823c", borderRadius: 999, padding: "8px 14px", fontSize: 12, display: "flex", alignItems: "center", gap: 6 }}>
            <Settings size={13}/> Panel admin
          </button>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<App />);

</script>
</body>
</html>
