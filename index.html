async function fbFetchCollection(name) {
  const out = {};
  try {
    const snap = await getDocs(collection(db, name));
    snap.forEach((d) => { out[d.id] = d.data(); });
  } catch (e) { console.error("fetch collection error", name, e); }
  return out;
}
async function fbFetchDoc(colName, id, fallback) {
  try {
    const snap = await getDoc(doc(db, colName, id));
    return snap.exists() ? snap.data() : fallback;
  } catch (e) { console.error("fetch doc error", colName, id, e); return fallback; }
}
async function fbSaveDoc(colName, id, data) {
  try { await setDoc(doc(db, colName, id), data); }
  catch (e) { console.error("save doc error", colName, id, e); }
}
async function fbDeleteDoc(colName, id) {
  try { await deleteDoc(doc(db, colName, id)); }
  catch (e) { console.error("delete doc error", colName, id, e); }
}

function normPhoto(p) {
  if (typeof p === "string") return { img: p, available: true };
  return { img: p.img, available: p.available !== false };
}
function normPhotos(list) {
  return (list || []).map(normPhoto);
}

function resizeImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadOrderExcel(order) {
  const rows = [["Timestamp","Unidades","Nombre del cliente","Fecha de Pedido","Modelo","Tipo","Descuento","Comentario","Precio","ID Pedido"]];
  order.items.forEach((it) => {
    rows.push([
      new Date(order.createdAt).toISOString(),
      it.qty,
      "",
      fmtDate(order.createdAt),
      [it.code, it.diameter, it.name, it.logo, it.color].filter(Boolean).join(" ").replace(/\s+/g, " ").trim(),
      "Venta",
      0,
      `Pedido Web ${order.id}`,
      it.price,
      order.id,
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Pedido");
  XLSX.writeFile(wb, `Pedido_${order.id}.xlsx`);
}

function downloadCSV(filename, rows) {
  const esc = (v) => {
    const s = v === null || v === undefined ? "" : String(v);
    if (s.includes(",") || s.includes('"') || s.includes("\n")) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const csv = rows.map((row) => row.map(esc).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function fmtDate(d) {
  const dt = new Date(d);
  const dd = String(dt.getDate()).padStart(2, "0");
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const yy = dt.getFullYear();
  return `${dd}/${mm}/${yy}`;
}

/* ---------------- Filter normalization helpers ---------------- */

const COLOR_MAP = [
  [/\bchrome\b/i, "Cromado"], [/\bsilver\b/i, "Plateado"], [/\bblack\b/i, "Negro"], [/\bwhite\b/i, "Blanco"],
  [/\bgold\b/i, "Dorado"], [/\bgild\b/i, "Dorado"], [/\bgr[ae]y\b/i, "Gris"], [/\bpurple\b/i, "Morado"],
  [/\bblue\b/i, "Azul"], [/\bred\b/i, "Rojo"], [/\bgreen\b/i, "Verde"], [/\byellow\b/i, "Amarillo"],
  [/\borange\b/i, "Naranja"], [/\bbronze\b/i, "Bronce"], [/\bcopper\b/i, "Bronce"], [/\bpink\b/i, "Rosado"],
  [/\bmud\b/i, "Marrón"], [/\bturquesa\b/i, "Turquesa"], [/\bgulf\b/i, "Gulf"], [/\bmanzana\b/i, "Verde manzana"],
];
function colorTagsOf(raw) {
  if (!raw) return [];
  const s = raw.trim();
  if (["NA", "N/A", "RANDOM", "VARIOS", ""].includes(s.toUpperCase())) return [];
  const tags = [];
  for (const [pat, es] of COLOR_MAP) if (pat.test(s) && !tags.includes(es)) tags.push(es);
  return tags;
}
const STANDARD_SIZES = [9, 9.8, 10, 10.3, 10.8, 11, 11.2, 12.7, 13, 14, 14.5, 15, 17];
function roundToStandardSize(n) {
  let best = STANDARD_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of STANDARD_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { best = s; bestDiff = d; }
  }
  return best;
}
function sizeTagOf(raw) {
  if (!raw) return null;
  const s = raw.trim();
  if (["NA", "VARIOS", "N/A", ""].includes(s.toUpperCase())) return null;
  if (!/mm/i.test(s)) return null;
  const pieces = s.split(/[+/,]/);
  const nums = [];
  for (const p of pieces) {
    const m = p.match(/(\d+\.?\d*)/);
    if (m) nums.push(m[1]);
  }
  if (nums.length === 0) return null;
  const fmt = (n) => { const f = roundToStandardSize(parseFloat(n)); return Number.isInteger(f) ? String(f) : String(Math.round(f * 100) / 100); };
  const seen = [];
  nums.forEach((n) => { const f = fmt(n); if (!seen.includes(f)) seen.push(f); });
  return seen.join("+") + "mm";
}
function vehicleOf(sizeTag) {
  if (!sizeTag) return null;
  const nums = sizeTag.replace(/mm/gi, "").split("+").map((n) => parseFloat(n)).filter((n) => !isNaN(n));
  if (nums.length === 0) return null;
  const max = Math.max(...nums);
  return max > 12.7 ? "Camioneta" : "Carro";
}
function brandTagOf(raw) {
  if (!raw) return null;
  const low = raw.trim().toLowerCase();
  if (["na", "n/a", "random", "", "no", "no logo"].includes(low) || low.includes("no logo")) return null;
  if (low.includes("good year") || low.includes("goodyear")) return "Goodyear";
  if (low.includes("toyo")) return "Toyo";
  if (low.includes("pirelli")) return "Pirelli";
  if (low.includes("bridgestone")) return "Bridgestone";
  if (low.includes("advan")) return "Advan";
  if (low.includes("bfgoodrich")) return "BFGoodrich";
  if (low.includes("dreamcar")) return "Dreamcar";
  if (low.includes("red lip")) return "Franja roja";
  if (low.includes("white lip")) return "Franja blanca";
  if (low.includes("brake disc")) return "Discos de freno";
  return null;
}

function PriceRangeSlider({ bounds, value, onChange }) {
  const [min, max] = bounds;
  const [lo, hi] = value || bounds;
  const trackRef = useRef(null);
  const draggingRef = useRef(null);

  const pctOf = (v) => max > min ? ((v - min) / (max - min)) * 100 : 0;

  const valFromClientX = (clientX) => {
    if (!trackRef.current) return min;
    const rect = trackRef.current.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return Math.round(min + pct * (max - min));
  };

  const startDrag = (which) => (e) => {
    e.preventDefault();
    draggingRef.current = which;
    const move = (ev) => {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const v = valFromClientX(clientX);
      if (draggingRef.current === "lo") onChange([Math.min(v, hi), hi]);
      else onChange([lo, Math.max(v, lo)]);
    };
    const up = () => {
      draggingRef.current = null;
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.removeEventListener("touchmove", move);
      document.removeEventListener("touchend", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    document.addEventListener("touchmove", move);
    document.addEventListener("touchend", up);
  };

  return (
    <div style={{ marginBottom: 12, padding: "10px 12px", background: "#151516", border: "1px solid #232326", borderRadius: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#e2823c", fontWeight: 700, marginBottom: 14 }}>
        <span>{money(lo)}</span>
        <span>{money(hi)}</span>
      </div>
      <div ref={trackRef} style={{ position: "relative", height: 20, display: "flex", alignItems: "center" }}>
        <div style={{ position: "absolute", left: 0, right: 0, height: 4, borderRadius: 999, background: "#2a2a2e" }} />
        <div style={{ position: "absolute", left: `${pctOf(lo)}%`, right: `${100 - pctOf(hi)}%`, height: 4, borderRadius: 999, background: "#e2823c" }} />
        <div onMouseDown={startDrag("lo")} onTouchStart={startDrag("lo")}
          style={{ position: "absolute", left: `${pctOf(lo)}%`, transform: "translateX(-50%)", width: 18, height: 18, borderRadius: "50%", background: "#e2823c", border: "2px solid #0c0c0d", cursor: "grab", boxShadow: "0 2px 6px rgba(0,0,0,0.4)" }} />
        <div onMouseDown={startDrag("hi")} onTouchStart={startDrag("hi")}
          style={{ position: "absolute", left: `${pctOf(hi)}%`, transform: "translateX(-50%)", width: 18, height: 18, borderRadius: "50%", background: "#e2823c", border: "2px solid #0c0c0d", cursor: "grab", boxShadow: "0 2px 6px rgba(0,0,0,0.4)" }} />
      </div>
    </div>
  );
}

function FilterDropdown({ label, options, selected, onToggle, onRemove, swatches, openId, setOpenId }) {
  const id = label;
  const open = openId === id;
  const boxRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpenId(null); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open, setOpenId]);

  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div ref={boxRef} style={{ position: "relative" }}>

              border: "1px solid #2c2c30", borderRadius: 10, padding: 8, minWidth: 200, maxHeight: 260,
              overflowY: "auto", boxShadow: "0 10px 30px rgba(0,0,0,0.5)",
            }}>

                    {swatches && <span style={{ width: 10, height: 10, borderRadius: "50%", background: swatches[opt] || "#666", border: "1px solid rgba(255,255,255,0.25)", flexShrink: 0 }} />}
                    {opt}
                  </label>
                );
              })}

          )}
        </div>
        {selected.map((opt) => (
          <span key={opt} style={{
            display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap",
            background: "rgba(226,130,60,0.15)", border: "1px solid #e2823c", color: "#e2823c",
            borderRadius: 999, padding: "5px 8px 5px 12px", fontSize: 12, fontWeight: 600,
          }}>
            {swatches && <span style={{ width: 9, height: 9, borderRadius: "50%", background: swatches[opt] || "#666", border: "1px solid rgba(255,255,255,0.4)" }} />}
            {opt}
            <button onClick={() => onRemove(opt)} style={{ background: "none", border: "none", color: "#e2823c", display: "flex", alignItems: "center", padding: 0 }}>
              <X size={13} />
            </button>
          </span>
        ))}
      </div>
    </div>
  );

}

function ClientCatalog({ products, overrides, cart, setCart, whatsappNumbers, onSubmitOrder, logo, wishlist, setWishlist, clientInfo, setClientInfo }) {
  const [query, setQuery] = useState("");
  const [sizes_sel, setSizesSel] = useState([]);
  const [colors_sel, setColorsSel] = useState([]);
  const [brands_sel, setBrandsSel] = useState([]);
  const [vehicle_sel, setVehicleSel] = useState([]);
  const [avail_sel, setAvailSel] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [wishlistOpen, setWishlistOpen] = useState(false);
  const [openFilter, setOpenFilter] = useState(null);

  const toggleIn = (setter) => (val) => setter((arr) => arr.includes(val) ? arr.filter((v) => v !== val) : [...arr, val]);

  const priceBounds = useMemo(() => {
    const prices = products.filter((p) => p.visible && !p.archived).map((p) => p.price).filter((n) => !isNaN(n));
    if (prices.length === 0) return [0, 100];
    return [Math.floor(Math.min(...prices)), Math.ceil(Math.max(...prices))];
  }, [products]);
  const [priceRange, setPriceRange] = useState(null);
  useEffect(() => { setPriceRange(priceBounds); }, [priceBounds[0], priceBounds[1]]);

  const sizes = useMemo(() => {
    const s = new Set(products.filter((p) => p.qty > 0).map((p) => p.sizeTag).filter(Boolean));
    return Array.from(s).sort((a, b) => parseFloat(a) - parseFloat(b));
  }, [products]);
  const colors = useMemo(() => {
    const s = new Set();
    products.filter((p) => p.qty > 0).forEach((p) => (p.colorTags || []).forEach((t) => s.add(t)));
    return Array.from(s).sort();
  }, [products]);
  const brands = useMemo(() => {
    const s = new Set(products.filter((p) => p.qty > 0).map((p) => p.brandTag).filter(Boolean));
    return Array.from(s).sort();
  }, [products]);
  const vehicles = useMemo(() => {
    const s = new Set(products.filter((p) => p.qty > 0).map((p) => vehicleOf(p.sizeTag)).filter(Boolean));
    return Array.from(s).sort();
  }, [products]);
  const availOptions = ["Disponible", "Fuera de stock"];

  const visible = useMemo(() => {
    return products.filter((p) => {
      if (!p.visible || p.archived) return false;
      if (priceRange && (p.price < priceRange[0] || p.price > priceRange[1])) return false;
      if (sizes_sel.length > 0 && !sizes_sel.includes(p.sizeTag)) return false;
      if (colors_sel.length > 0 && !(p.colorTags || []).some((t) => colors_sel.includes(t))) return false;
      if (brands_sel.length > 0 && !brands_sel.includes(p.brandTag)) return false;
      if (vehicle_sel.length > 0 && !vehicle_sel.includes(vehicleOf(p.sizeTag))) return false;
      if (avail_sel.length > 0) {
        const availLabel = p.qty > 0 ? "Disponible" : "Fuera de stock";
        if (!avail_sel.includes(availLabel)) return false;
      }
      if (!query.trim()) return true;
      const q = query.toLowerCase();
      return [p.code, p.name, p.diameter, p.color, p.logo].some((f) => (f || "").toLowerCase().includes(q));
    });
  }, [products, query, sizes_sel, colors_sel, brands_sel, vehicle_sel, avail_sel, priceRange]);

  const cartCount = Object.values(cart).reduce((s, v) => s + v.qty, 0);

  const toggleWishlist = (id) => setWishlist((w) => w.includes(id) ? w.filter((x) => x !== id) : [...w, id]);

  const addOne = (productId, variantIdx, variantImg) => setCart((c) => {
    const key = `${productId}::${variantIdx}`;
    const existing = c[key];
    return { ...c, [key]: { productId, variantIdx, variantImg, qty: (existing ? existing.qty : 0) + 1 } };
  });
  const removeOne = (key) => setCart((c) => {
    const existing = c[key];
    if (!existing) return c;
    const nextQty = Math.max(0, existing.qty - 1);
    const next = { ...c };
    if (nextQty === 0) delete next[key]; else next[key] = { ...existing, qty: nextQty };
    return next;
  });
  const setQty = (key, qty) => setCart((c) => {
    const next = { ...c };
    if (qty <= 0 || !next[key]) delete next[key]; else next[key] = { ...next[key], qty };
    return next;
  });

  return (
    <>
      <Header view="client" cartCount={cartCount} onOpenCart={() => setCartOpen(true)} isAdmin={false} setView={() => {}} logo={logo} wishlistCount={wishlist.length} onOpenWishlist={() => setWishlistOpen(true)} />
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "16px" }}>
        <div style={{ position: "relative", marginBottom: 12 }}>
          <Search size={16} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#7a7974" }} />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="Buscar por código, nombre, color, medida..."
            style={{ width: "100%", background: "#17171a", border: "1px solid #2a2a2e", borderRadius: 10, padding: "10px 12px 10px 36px", color: "#f3f1ec", fontSize: 13.5 }}
          />
        </div>

        {priceRange && <PriceRangeSlider bounds={priceBounds} value={priceRange} onChange={setPriceRange} />}

        <FilterDropdown label="Disponibilidad" options={availOptions} selected={avail_sel} onToggle={toggleIn(setAvailSel)} onRemove={toggleIn(setAvailSel)} openId={openFilter} setOpenId={setOpenFilter} />
        <FilterDropdown label="Tipo de vehículo" options={vehicles} selected={vehicle_sel} onToggle={toggleIn(setVehicleSel)} onRemove={toggleIn(setVehicleSel)} openId={openFilter} setOpenId={setOpenFilter} />
        <FilterDropdown label="Tamaño" options={sizes} selected={sizes_sel} onToggle={toggleIn(setSizesSel)} onRemove={toggleIn(setSizesSel)} openId={openFilter} setOpenId={setOpenFilter} />

        {visible.length === 0 ? (

          </div>
        ) : (

                cart={cart} onAdd={addOne} onRemove={removeOne}

      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} products={products} onQty={setQty}

        overrides={overrides} onRemove={toggleWishlist} onAddToCart={(id) => addOne(id)} />
    </>
  );
}

  const doLogin = async () => {

      setErr("Correo o contraseña incorrectos.");

    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>

        />
        <input
          type="password" value={password} autoComplete="current-password"

          placeholder="Contraseña"
          style={{ width: "100%", background: "#1f1f22", border: err ? "1px solid #d9534f" : "1px solid #2a2a2e", borderRadius: 8, padding: "10px 12px", color: "#f3f1ec", fontSize: 14, marginBottom: 10 }}

function AdminPedidos({ orders, setOrders, clientes, setClientes, overrides, setOverrides }) {
  const [dragId, setDragId] = useState(null);

  const adjustStock = (order, sign) => {
    // sign: -1 para descontar (al pagar), +1 para devolver (si se revierte de Pagado)
    setOverrides((prev) => {
      const next = { ...prev };
      order.items.forEach((it) => {
        const currentOv = next[it.id] || {};
        const currentQty = currentOv.qty ?? (SEED_PRODUCTS.find((p) => p.id === it.id)?.qty ?? 0);
        const newQty = Math.max(0, currentQty + sign * it.qty);
        const newOv = { ...currentOv, qty: newQty };
        next[it.id] = newOv;
        fbSaveDoc("overrides", it.id, newOv);
      });
      return next;
    });
  };

  const updateOrder = (id, patch) => {
    setOrders((prev) => {
      const current = prev.find((o) => o.id === id);
      let finalPatch = patch;
      if (current && patch.status && patch.status !== current.status) {
        if (patch.status === "Pagado" && !current.stockDeducted) {
          adjustStock(current, -1);
          finalPatch = { ...patch, stockDeducted: true };
        } else if (current.status === "Pagado" && patch.status !== "Pagado" && current.stockDeducted) {
          adjustStock(current, 1);
          finalPatch = { ...patch, stockDeducted: false };
        }
      }
      const next = prev.map((o) => o.id === id ? { ...o, ...finalPatch } : o);
      const updated = next.find((o) => o.id === id);
      if (updated) fbSaveDoc("orders", id, updated);
      return next;
    });
  };

  const deleteOrder = (id) => {
    if (!window.confirm("¿Eliminar este pedido? Esta acción no se puede deshacer.")) return;
    setOrders((prev) => prev.filter((o) => o.id !== id));
    fbDeleteDoc("orders", id);
  };

  const assignCliente = (orderId, name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (!clientes.includes(trimmed)) {
      const updated = [...clientes, trimmed].sort();
      setClientes(updated);
      fbSaveDoc("meta", "clientes", { list: updated });
    }
    updateOrder(orderId, { cliente: trimmed });
  };

  const exportPagados = () => {
    const rows = [["Timestamp","Unidades","Nombre del cliente","Fecha de Pedido","Modelo","Tipo","Descuento","Comentario","Precio","ID Pedido"]];
    orders.filter((o) => o.status === "Pagado").forEach((o) => {
      o.items.forEach((it) => {
        rows.push([
          new Date(o.createdAt).toISOString(),
          it.qty,
          o.cliente || "",
          fmtDate(o.createdAt),
          `${it.code} ${it.diameter} ${it.name} ${it.logo} ${it.color}`.replace(/\s+/g," ").trim(),
          "Venta",
          o.discount || 0,
          `Pedido Web ${o.id}`,
          it.price,
          o.id,
        ]);
      });
    });
    downloadCSV(`pedidos_confirmados_${Date.now()}.csv`, rows);
  };

  const onDragStart = (id) => (e) => { setDragId(id); e.dataTransfer.effectAllowed = "move"; };
  const onColDragOver = (e) => e.preventDefault();
  const onColDrop = (status) => () => {
    if (dragId) updateOrder(dragId, { status });
    setDragId(null);
  };

  const sorted = [...orders].sort((a, b) => b.createdAt - a.createdAt);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", marginBottom: 14 }}>
        <button onClick={exportPagados} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <Download size={14} /> Exportar pagados (CSV)
        </button>
      </div>

      <div className="m164-scrollbar" style={{ display: "flex", gap: 12, overflowX: "auto", paddingBottom: 10, alignItems: "flex-start" }}>
        {ORDER_STATUSES.map((status) => {
          const inCol = sorted.filter((o) => o.status === status);
          const color = STATUS_COLORS[status];
          return (
            <div key={status} onDragOver={onColDragOver} onDrop={onColDrop(status)}
              style={{ width: 280, flexShrink: 0, background: "#111112", border: "1px solid #202023", borderRadius: 12, padding: 10, minHeight: 200 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, padding: "0 2px" }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: color }} />
                <span style={{ fontSize: 12.5, fontWeight: 700, color }}>{status}</span>
                <span style={{ marginLeft: "auto", fontSize: 11, color: "#7a7974" }}>{inCol.length}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {inCol.length === 0 && (
                  <div style={{ fontSize: 11.5, color: "#5a5a5d", textAlign: "center", padding: "14px 0" }}>Sin pedidos</div>
                )}
                {inCol.map((o) => (
                  <OrderCard key={o.id} o={o} overrides={overrides} clientes={clientes}
                    onUpdate={updateOrder} onDelete={deleteOrder} onDragStart={onDragStart} onAssignCliente={assignCliente} />
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <datalist id="clientes-list">
        {clientes.map((c) => <option key={c} value={c} />)}
      </datalist>
    </div>
  );
}

function PhotoCropModal({ image, onClose, onApply }) {
  const [zoom, setZoom] = useState(1);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const imgRef = useRef(null);
  const boxRef = useRef(null);
  const dragRef = useRef(null);
  const BOX = 280;

  const startDrag = (e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragRef.current = { startX: clientX, startY: clientY, origX: pos.x, origY: pos.y };
    const move = (ev) => {
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
      const dx = cx - dragRef.current.startX;
      const dy = cy - dragRef.current.startY;
      setPos({ x: dragRef.current.origX + dx, y: dragRef.current.origY + dy });
    };
    const up = () => {
      dragRef.current = null;
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.removeEventListener("touchmove", move);
      document.removeEventListener("touchend", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    document.addEventListener("touchmove", move);
    document.addEventListener("touchend", up);
  };

  const applyCrop = () => {
    const img = imgRef.current;
    if (!img) return;
    const natW = img.naturalWidth, natH = img.naturalHeight;
    const baseScale = Math.max(BOX / natW, BOX / natH) * zoom;
    const dispW = natW * baseScale, dispH = natH * baseScale;
    const left = (BOX - dispW) / 2 + pos.x;
    const top = (BOX - dispH) / 2 + pos.y;
    const OUT = 600;
    const canvas = document.createElement("canvas");
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext("2d");
    const outScale = OUT / BOX;
    ctx.drawImage(img, left * outScale, top * outScale, dispW * outScale, dispH * outScale);
    onApply(canvas.toDataURL("image/jpeg", 0.75));
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 70, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: "#141415", border: "1px solid #2a2a2e", borderRadius: 16, padding: 20, width: "min(360px,100%)" }}>
        <div className="disp" style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Recortar foto</div>
        <div ref={boxRef} onMouseDown={startDrag} onTouchStart={startDrag}
          style={{ width: BOX, height: BOX, margin: "0 auto", borderRadius: 10, overflow: "hidden", background: "#0f0f10", position: "relative", cursor: "grab", border: "1px solid #2a2a2e" }}>
          <img ref={imgRef} src={image} draggable={false}
            style={{
              position: "absolute", left: "50%", top: "50%",
              transform: `translate(-50%, -50%) translate(${pos.x}px, ${pos.y}px) scale(${zoom})`,
              minWidth: "100%", minHeight: "100%", width: "auto", height: "100%", objectFit: "cover",
              userSelect: "none", pointerEvents: "none",
            }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14 }}>
          <span style={{ fontSize: 11, color: "#7a7974" }}>Zoom</span>
          <input type="range" min="1" max="3" step="0.05" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))}
            style={{ flex: 1, accentColor: "#e2823c" }} />
        </div>
        <div style={{ fontSize: 11, color: "#7a7974", marginTop: 8, marginBottom: 14 }}>Arrastra la imagen para posicionarla, usa el zoom para acercar.</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onClose} style={{ flex: 1, background: "transparent", border: "1px solid #2a2a2e", color: "#9a9994", borderRadius: 8, padding: "10px", fontSize: 13 }}>Cancelar</button>
          <button onClick={applyCrop} style={{ flex: 1, background: "#e2823c", border: "none", color: "#0c0c0d", fontWeight: 700, borderRadius: 8, padding: "10px", fontSize: 13 }}>Aplicar recorte</button>
        </div>
      </div>
    </div>
  );
}

function ProductPhotosModal({ product, photos, onClose, onSave }) {
  const [list, setList] = useState(normPhotos(photos));
  const [pasteFlash, setPasteFlash] = useState(false);
  const [cropIndex, setCropIndex] = useState(null);
  const MAXP = 7;
  const fileRef = useRef(null);
  const cameraRef = useRef(null);
  const listRef = useRef(list);
  useEffect(() => { listRef.current = list; }, [list]);

  const handleFiles = async (files) => {
    const arr = Array.from(files).slice(0, MAXP - listRef.current.length);
    if (arr.length === 0) return;
    const resized = await Promise.all(arr.map((f) => resizeImage(f, 650, 0.6)));
    setList((l) => [...l, ...resized.map((img) => ({ img, available: true }))]);
  };

  useEffect(() => {
    const onPaste = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const imgFiles = [];
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const f = item.getAsFile();
          if (f) imgFiles.push(f);
        }
      }
      if (imgFiles.length > 0) {
        e.preventDefault();
        handleFiles(imgFiles);
        setPasteFlash(true);
        setTimeout(() => setPasteFlash(false), 700);
      }
    };

function ImportExcelModal({ onClose, onImport }) {
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const fileRef = useRef(null);

  const norm = (s) => (s || "").toString().trim().toLowerCase();

  const handleFile = async (file) => {
    setError(""); setFileName(file.name);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (json.length === 0) { setError("El archivo no tiene filas de datos."); setRows([]); return; }

      const keyMap = {};
      Object.keys(json[0]).forEach((k) => {
        const nk = norm(k);
        if (nk.includes("codigo") || nk.includes("código")) keyMap.code = k;
        else if (nk.includes("diameter") || nk.includes("medida")) keyMap.diameter = k;
        else if (nk.includes("name") || nk.includes("nombre")) keyMap.name = k;
        else if (nk.includes("logo") || nk.includes("marca")) keyMap.logo = k;
        else if (nk.includes("color")) keyMap.color = k;
        else if (nk.includes("price") || nk.includes("precio")) keyMap.price = k;
        else if (nk.includes("quantity") || nk.includes("cantidad") || nk.includes("stock")) keyMap.qty = k;
      });

      if (!keyMap.code || !keyMap.name) {
        setError("No reconozco las columnas. Asegúrate de tener al menos Código y Name/Nombre.");
        setRows([]);
        return;
      }

      const parsed = json.map((r) => ({
        code: (r[keyMap.code] ?? "").toString().trim(),
        diameter: (r[keyMap.diameter] ?? "").toString().trim(),
        name: (r[keyMap.name] ?? "").toString().trim(),
        logo: (r[keyMap.logo] ?? "NA").toString().trim() || "NA",
        color: (r[keyMap.color] ?? "NA").toString().trim() || "NA",
        price: parseFloat(r[keyMap.price]) || 0,
        qty: parseInt(r[keyMap.qty]) || 0,
      })).filter((r) => r.code);

      setRows(parsed);
    } catch (e) {
      setError("No pude leer el archivo. Asegúrate de que sea un .xlsx válido.");
      setRows([]);
    }
  };

  const confirm = () => {
    onImport(rows);
    onClose();
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: "#141415", border: "1px solid #2a2a2e", borderRadius: 16, padding: 20, width: "min(600px,100%)", maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div className="disp" style={{ fontSize: 15, fontWeight: 700 }}>Importar productos desde Excel</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#9a9994" }}><X size={18} /></button>
        </div>

        {rows.length === 0 && (
          <>
            <div style={{ fontSize: 12, color: "#9a9994", marginBottom: 12, lineHeight: 1.5 }}>
              Sube un archivo .xlsx con columnas <b>Código, Diameter, Name, Logo, Color, Price, Quantity</b> (los nombres pueden variar un poco, ej. "Nombre" o "Precio" también funcionan).
            </div>
            <button onClick={() => fileRef.current.click()} style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, border: "1.5px dashed #3a3a3e", borderRadius: 10, padding: "28px", background: "transparent", color: "#9a9994" }}>
              <FileSpreadsheet size={26} />
              <span style={{ fontSize: 12.5 }}>{fileName || "Toca para elegir un archivo .xlsx"}</span>
            </button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }} onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
            {error && <div style={{ color: "#e08585", fontSize: 12, marginTop: 10 }}>{error}</div>}
          </>
        )}

        {rows.length > 0 && (
          <>
            <div style={{ fontSize: 12.5, color: "#3fae6a", marginBottom: 10 }}>{fileName} — {rows.length} productos listos para importar</div>
            <div className="m164-scrollbar" style={{ maxHeight: 280, overflowY: "auto", border: "1px solid #232326", borderRadius: 8, marginBottom: 14 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>
                <thead>
                  <tr style={{ position: "sticky", top: 0, background: "#1a1a1c" }}>
                    {["Código","Medida","Nombre","Logo","Color","Precio","Cant."].map((h) => (
                      <th key={h} style={{ padding: "6px 8px", textAlign: "left", color: "#9a9994", fontWeight: 600 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} style={{ borderTop: "1px solid #1d1d20" }}>
                      <td style={{ padding: "5px 8px", color: "#e2823c", fontWeight: 600 }}>{r.code}</td>
                      <td style={{ padding: "5px 8px" }}>{r.diameter}</td>
                      <td style={{ padding: "5px 8px" }}>{r.name}</td>
                      <td style={{ padding: "5px 8px" }}>{r.logo}</td>
                      <td style={{ padding: "5px 8px" }}>{r.color}</td>
                      <td style={{ padding: "5px 8px" }}>{money(r.price)}</td>
                      <td style={{ padding: "5px 8px" }}>{r.qty}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { setRows([]); setFileName(""); }} style={{ flex: 1, background: "transparent", border: "1px solid #2a2a2e", color: "#9a9994", borderRadius: 8, padding: "10px", fontSize: 13 }}>Elegir otro archivo</button>
              <button onClick={confirm} style={{ flex: 1, background: "#e2823c", border: "none", color: "#0c0c0d", fontWeight: 700, borderRadius: 8, padding: "10px", fontSize: 13 }}>Importar {rows.length} productos</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function AdminProductos({ products, setAddedProducts, overrides, setOverrides }) {
  const [query, setQuery] = useState("");
  const [photoTarget, setPhotoTarget] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [viewMode, setViewMode] = useState("activos");

  const COLUMN_DEFS = {
    photo: { label: "Foto", sortable: false },
    code: { label: "CÓDIGO", sortable: true },
    diameter: { label: "Diameter", sortable: true },
    name: { label: "Name", sortable: true },
    logo: { label: "Logo", sortable: true },
    color: { label: "Color", sortable: true },
    complete: { label: "Complete Name", sortable: true },
    price: { label: "Price", sortable: true },
    qty: { label: "Stock disponible", sortable: true },
    photos: { label: "Fotos", sortable: false },
    visible: { label: "Mostrar", sortable: false },
    actions: { label: "Acciones", sortable: false },
  };
  const DEFAULT_COL_ORDER = ["photo","code","diameter","name","logo","color","complete","price","qty","photos","visible","actions"];
  const [columnOrder, setColumnOrder] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("m164_admin_colorder"));
      if (Array.isArray(saved) && saved.length === DEFAULT_COL_ORDER.length && DEFAULT_COL_ORDER.every((c) => saved.includes(c))) return saved;
    } catch (e) {}
    return DEFAULT_COL_ORDER;
  });
  useEffect(() => { localStorage.setItem("m164_admin_colorder", JSON.stringify(columnOrder)); }, [columnOrder]);
  const [dragCol, setDragCol] = useState(null);
  const onColDragStart = (id) => (e) => { setDragCol(id); e.dataTransfer.effectAllowed = "move"; };
  const onColDragOver = (e) => e.preventDefault();
  const onColDrop = (targetId) => () => {
    if (!dragCol || dragCol === targetId) return;
    setColumnOrder((prev) => {
      const next = prev.filter((c) => c !== dragCol);
      const idx = next.indexOf(targetId);
      next.splice(idx, 0, dragCol);
      return next;
    });
    setDragCol(null);
  };

  const toggleSort = (key) => {
    if (sortKey === key) {
      setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    } else {
      setSortKey(key);
      setSortDir("asc");
    }
  };

  const completeName = (p) => [p.code, p.diameter, p.name, p.logo, p.color].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();

  const visible = useMemo(() => {
    let list = products.filter((p) => {
      if (!query.trim()) return true;
      const q = query.toLowerCase();
      return [p.code, p.name, p.diameter, p.logo, p.color].some((f) => (f || "").toLowerCase().includes(q));
    });
    list = list.filter((p) => (viewMode === "archivados" ? p.archived : !p.archived));
    if (sortKey) {
      list = [...list].sort((a, b) => {
        let va, vb;
        if (sortKey === "price" || sortKey === "qty") {
          va = sortKey === "price" ? (overrides[a.id]?.price ?? a.price) : (overrides[a.id]?.qty ?? a.qty);
          vb = sortKey === "price" ? (overrides[b.id]?.price ?? b.price) : (overrides[b.id]?.qty ?? b.qty);
        } else if (sortKey === "complete") {
          va = completeName(a).toLowerCase(); vb = completeName(b).toLowerCase();
        } else {
          va = (a[sortKey] || "").toString().toLowerCase();
          vb = (b[sortKey] || "").toString().toLowerCase();
        }
        if (va < vb) return sortDir === "asc" ? -1 : 1;
        if (va > vb) return sortDir === "asc" ? 1 : -1;
        return 0;
      });
    }
    return list;
  }, [products, query, sortKey, sortDir, overrides, viewMode]);

  const updateOverride = (id, patch) => {
    setOverrides((prev) => {
      const nextForId = { ...(prev[id] || {}), ...patch };
      fbSaveDoc("overrides", id, nextForId);
      return { ...prev, [id]: nextForId };
    });
  };

  const archiveProduct = (id) => updateOverride(id, { archived: true });
  const restoreProduct = (id) => updateOverride(id, { archived: false });
  const deleteProduct = (id) => {
    if (!window.confirm("¿Eliminar este producto definitivamente? No aparecerá más en el catálogo ni en este panel.")) return;
    updateOverride(id, { deleted: true });
  };

  const exportNuevos = () => {
    const rows = [["Código","Diameter","Name","Logo","Color","Price","Quantity"]];
    products.filter((p) => p.isNew).forEach((p) => {
      const ov = overrides[p.id] || {};
      rows.push([p.code, p.diameter, p.name, p.logo, p.color, ov.price ?? p.price, ov.qty ?? p.qty]);
    });
    downloadCSV(`productos_nuevos_${Date.now()}.csv`, rows);
  };

  const th = { textAlign: "left", padding: "8px 10px", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", color: "#9a9994", borderBottom: "1px solid #2a2a2e", whiteSpace: "nowrap", background: "#151516", position: "sticky", top: 0 };
  const td = { padding: "6px 10px", fontSize: 12.5, borderBottom: "1px solid #1d1d20", color: "#e9e7e1", whiteSpace: "nowrap" };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
          <Search size={14} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#7a7974" }} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar producto..."
            style={{ width: "100%", background: "#17171a", border: "1px solid #2a2a2e", borderRadius: 8, padding: "8px 10px 8px 30px", color: "#f3f1ec", fontSize: 13 }} />
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {[["activos","Activos"],["archivados","Archivados"]].map(([id,label]) => (
            <button key={id} onClick={() => setViewMode(id)} style={{
              padding: "8px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 600,
              border: viewMode === id ? "1px solid #e2823c" : "1px solid #2a2a2e",
              background: viewMode === id ? "rgba(226,130,60,0.15)" : "transparent",
              color: viewMode === id ? "#e2823c" : "#9a9994",
            }}>{label}</button>
          ))}
        </div>
        <button onClick={() => setShowNew(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#e2823c", border: "none", color: "#0c0c0d", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
          <Plus size={14} /> Nuevo producto
        </button>
        <button onClick={() => setShowImport(true)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <FileSpreadsheet size={14} /> Importar Excel
        </button>
        <button onClick={exportNuevos} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <Download size={14} /> Exportar nuevos
        </button>
      </div>
      <div style={{ fontSize: 11.5, color: "#7a7974", marginBottom: 10 }}>Mostrando {visible.length} de {products.length} productos. Precio y stock disponible se guardan al escribir — úsalo para corregir el inventario manualmente cuando agregues fotos o edites datos.</div>
      <div className="m164-scrollbar" style={{ overflowX: "auto", border: "1px solid #232326", borderRadius: 10, maxHeight: "70vh", overflowY: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 980 }}>
          <thead>
            <tr>
              {columnOrder.map((colId) => {
                const def = COLUMN_DEFS[colId];
                const isComplete = colId === "complete";
                return (
                  <th key={colId}
                    draggable
                    onDragStart={onColDragStart(colId)}
                    onDragOver={onColDragOver}
                    onDrop={onColDrop(colId)}
                    onClick={def.sortable ? () => toggleSort(colId) : undefined}
                    style={{
                      ...th,
                      ...(isComplete ? { minWidth: 260 } : {}),
                      cursor: def.sortable ? "pointer" : "grab",
                      userSelect: "none",
                      opacity: dragCol === colId ? 0.4 : 1,
                    }}
                    title="Arrastra para reordenar columnas"
                  >
                    <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                      {def.label}
                      {def.sortable && (sortKey === colId ? (sortDir === "asc" ? <ChevronDown size={11} style={{ transform: "rotate(180deg)" }} /> : <ChevronDown size={11} />) : <ChevronDown size={11} style={{ opacity: 0.25 }} />)}
                    </span>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {visible.map((p) => {
              const ov = overrides[p.id] || {};
              const photos = normPhotos(ov.photos);
              const cellFor = (colId) => {
                switch (colId) {
                  case "photo":
                    return (
                      <div style={{ width: 32, height: 32, borderRadius: 5, overflow: "hidden", background: "#0f0f10", display: "flex", alignItems: "center", justifyContent: "center" }}>

                  case "code":
                    return <span style={{ fontWeight: 700, color: "#e2823c" }}>{p.code}{p.isNew && <span style={{ color: "#3fae6a", fontSize: 9.5, marginLeft: 4 }}>nuevo</span>}</span>;
                  case "diameter":
                    return p.diameter;
                  case "name":
                    return p.name;
                  case "logo":
                    return p.logo;
                  case "color":
                    return p.color;
                  case "complete":
                    return <span style={{ color: "#b5b3ad", fontSize: 12 }}>{completeName(p)}</span>;
                  case "price":
                    return (
                      <input type="number" step="0.01" value={ov.price ?? p.price}
                        onChange={(e) => updateOverride(p.id, { price: parseFloat(e.target.value) || 0 })}

                    );
                  case "qty":
                    return (
                      <input type="number" value={ov.qty ?? p.qty} title="Corrige aquí el stock disponible"
                        onChange={(e) => updateOverride(p.id, { qty: parseInt(e.target.value) || 0 })}

                    );
                  case "photos":
                    return (
                      <button onClick={() => setPhotoTarget(p)} style={{ background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 6, padding: "5px 8px", fontSize: 11.5, display: "flex", alignItems: "center", gap: 4 }}>
                        <Upload size={12} /> {photos.length || 0}

                  case "visible":
                    return (
                      <button onClick={() => updateOverride(p.id, { visible: !(p.visible !== false) })} title={p.visible !== false ? "Ocultar del catálogo" : "Mostrar en el catálogo"}
                        style={{
                          width: 38, height: 22, borderRadius: 999, border: "none", position: "relative",
                          background: p.visible !== false ? "#3fae6a" : "#3a3a3e", flexShrink: 0,
                        }}>
                        <span style={{
                          position: "absolute", top: 2, left: p.visible !== false ? 18 : 2, width: 18, height: 18,
                          borderRadius: "50%", background: "#fff", transition: "left 0.15s",
                        }} />
                      </button>
                    );
                  case "actions":
                    return viewMode === "archivados" ? (
                      <button onClick={() => restoreProduct(p.id)} title="Restaurar a activos"
                        style={{ background: "transparent", border: "1px solid #3fae6a", color: "#3fae6a", fontSize: 11.5, borderRadius: 6, padding: "5px 8px" }}>
                        Restaurar
                      </button>
                    ) : (
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => archiveProduct(p.id)} title="Enviar a antiguos/archivados"
                          style={{ background: "transparent", border: "1px solid #2a2a2e", color: "#9a9994", fontSize: 11, borderRadius: 6, padding: "5px 7px" }}>

                        </button>
                        <button onClick={() => deleteProduct(p.id)} title="Eliminar definitivamente"
                          style={{ background: "transparent", border: "1px solid #4a2a2a", color: "#e08585", borderRadius: 6, padding: "5px 7px", display: "flex", alignItems: "center" }}>
                          <Trash2 size={12} />
                        </button>
                      </div>
                    );
                  default:
                    return null;
                }
              };
              return (
                <tr key={p.id}>
                  {columnOrder.map((colId) => (
                    <td key={colId} style={{ ...td, ...(colId === "name" || colId === "complete" ? { whiteSpace: "normal", minWidth: colId === "complete" ? 260 : 160 } : {}) }}>
                      {cellFor(colId)}
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {photoTarget && (
        <ProductPhotosModal product={photoTarget} photos={(overrides[photoTarget.id] || {}).photos || []}
          onClose={() => setPhotoTarget(null)}
          onSave={(list) => { updateOverride(photoTarget.id, { photos: list }); setPhotoTarget(null); }} />
      )}
      {showNew && (
        <NewProductModal onClose={() => setShowNew(false)}
          onSave={(form) => {
            const id = "new-" + Date.now();
            const newProduct = {
              id, code: form.code, diameter: form.diameter, name: form.name, logo: form.logo, color: form.color,
              price: form.price, qty: form.qty, category: "Otros", isNew: true,
              sizeTag: sizeTagOf(form.diameter), colorTags: colorTagsOf(form.color), brandTag: brandTagOf(form.logo),
            };
            setAddedProducts((prev) => [...prev, newProduct]);
            fbSaveDoc("added_products", id, newProduct);

      {showImport && (
        <ImportExcelModal onClose={() => setShowImport(false)}
          onImport={(importedRows) => {

              code: r.code, diameter: r.diameter, name: r.name, logo: r.logo, color: r.color,
              price: r.price, qty: r.qty, category: "Otros", isNew: true,
              sizeTag: sizeTagOf(r.diameter), colorTags: colorTagsOf(r.color), brandTag: brandTagOf(r.logo),
            }));
            setAddedProducts((prev) => [...prev, ...newOnes]);
            newOnes.forEach((p) => fbSaveDoc("added_products", p.id, p));
          }} />
      )}
    </div>
  );
}

function AdminWishlist({ wishlists, setWishlists }) {
  const sorted = [...wishlists].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  const deleteWishlist = (clientId) => {
    if (!window.confirm("¿Eliminar este registro de favoritos guardado? Esta acción no se puede deshacer.")) return;
    setWishlists((prev) => prev.filter((w) => w.clientId !== clientId));
    fbDeleteDoc("wishlists", clientId);
  };

  const productCounts = useMemo(() => {
    const counts = {};
    wishlists.forEach((w) => (w.items || []).forEach((it) => {
      const key = `${it.code} ${it.color || ""}`.trim();
      counts[key] = (counts[key] || 0) + 1;
    }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }, [wishlists]);

  const exportCSV = () => {
    const rows = [["Cliente","Ciudad","Código","Nombre","Diameter","Color","Precio","Fecha"]];
    sorted.forEach((w) => {
      const fecha = w.updatedAt ? fmtDate(w.updatedAt) : "";
      const nombre = `${w.nombre || ""} ${w.apellido || ""}`.trim() || "(sin nombre)";
      (w.items || []).forEach((it) => {
        rows.push([nombre, w.ciudad || "", it.code, it.name, it.diameter, it.color, it.price, fecha]);
      });
    });
    downloadCSV(`wishlists_${Date.now()}.csv`, rows);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontSize: 12.5, color: "#9a9994" }}>{wishlists.length} cliente(s) con favoritos guardados — úsalo para planificar tus próximas compras.</div>
        <button onClick={exportCSV} style={{ display: "flex", alignItems: "center", gap: 6, background: "#1a1a1c", border: "1px solid #2c2c30", color: "#f3f1ec", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600 }}>
          <Download size={14} /> Exportar CSV
        </button>
      </div>

      {productCounts.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div className="disp" style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Más deseados</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {productCounts.slice(0, 15).map(([key, count]) => (
              <span key={key} style={{ background: "#151516", border: "1px solid #232326", borderRadius: 999, padding: "5px 12px", fontSize: 12, color: "#e9e7e1" }}>
                {key} <span style={{ color: "#e2823c", fontWeight: 700 }}>×{count}</span>
              </span>
            ))}
          </div>
        </div>
      )}

      {sorted.length === 0 ? (
        <div style={{ textAlign: "center", padding: "40px 0", color: "#7a7974" }}>Todavía nadie ha agregado favoritos.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {sorted.map((w) => (
            <div key={w.clientId} style={{ background: "#151516", border: "1px solid #232326", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{`${w.nombre || ""} ${w.apellido || ""}`.trim() || "(sin nombre — aún no hizo pedido)"}</div>
                  <div style={{ fontSize: 12, color: "#7a7974" }}>{w.ciudad || "Ciudad no indicada"}{w.updatedAt ? ` · ${fmtDate(w.updatedAt)}` : ""}</div>
                </div>
                <span style={{ fontSize: 11.5, color: "#e2823c", fontWeight: 700 }}>{(w.items || []).length} producto(s)</span>
                <button onClick={() => deleteWishlist(w.clientId)} title="Eliminar este registro"
                  style={{ background: "transparent", border: "1px solid #4a2a2a", color: "#e08585", borderRadius: 6, padding: "5px 7px", display: "flex", alignItems: "center", marginLeft: 8 }}>
                  <Trash2 size={12} />
                </button>
              </div>
              <div style={{ borderTop: "1px solid #202023", paddingTop: 8 }}>
                {(w.items || []).map((it, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "2px 0", color: "#c9c8c3" }}>
                    <span>{it.code} — {it.name} {it.color && it.color.toUpperCase() !== "NA" ? `(${it.color})` : ""}</span>
                    <span>{money(it.price)}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Root App ---------------- */

function App() {
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("client");
  const [showGate, setShowGate] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (user) => setIsAdmin(!!user));
    return unsub;
  }, []);

  const [addedProducts, setAddedProducts] = useState([]);
  const [overrides, setOverrides] = useState({});
  const [orders, setOrders] = useState([]);
  const [clientes, setClientes] = useState(SEED_CLIENTES);
  const [settings, setSettings] = useState({ whatsappNumbers: [{ label: "", number: "" }], pin: "1234", logo: null });
  const [cart, setCart] = useState({});
  const [toast, setToast] = useState(null);
  const [wishlists, setWishlists] = useState([]);

  const [clientId] = useState(() => {
    let id = localStorage.getItem("m164_clientId");
    if (!id) { id = "c" + Date.now() + Math.random().toString(36).slice(2, 8); localStorage.setItem("m164_clientId", id); }
    return id;
  });
  const [clientInfo, setClientInfo] = useState(() => {
    try { return JSON.parse(localStorage.getItem("m164_clientInfo")) || { nombre: "", apellido: "", ciudad: "" }; }
    catch (e) { return { nombre: "", apellido: "", ciudad: "" }; }
  });
  useEffect(() => { localStorage.setItem("m164_clientInfo", JSON.stringify(clientInfo)); }, [clientInfo]);

  const [wishlist, setWishlist] = useState(() => {
    try { return JSON.parse(localStorage.getItem("m164_wishlist")) || []; }
    catch (e) { return []; }
  });
  useEffect(() => {
    localStorage.setItem("m164_wishlist", JSON.stringify(wishlist));
    if (!loaded) return;
    if (wishlist.length === 0) return; // no borres el historial en el admin cuando el cliente vacía su lista
    const items = wishlist.map((id) => {
      const p = [...SEED_PRODUCTS, ...addedProducts].find((x) => x.id === id);
      return p ? { code: p.code, name: p.name, diameter: p.diameter, color: p.color, price: p.price } : null;
    }).filter(Boolean);
    fbSaveDoc("wishlists", clientId, {
      clientId, nombre: clientInfo.nombre, apellido: clientInfo.apellido, ciudad: clientInfo.ciudad,
      items, updatedAt: Date.now(),
    });
  }, [wishlist, clientInfo.nombre, clientInfo.apellido, clientInfo.ciudad, loaded]);

  useEffect(() => {
    (async () => {
      const [addedMap, overridesMap, ordersMap, clientesDoc, settingsDoc, wishlistsMap] = await Promise.all([
        fbFetchCollection("added_products"),
        fbFetchCollection("overrides"),
        fbFetchCollection("orders"),
        fbFetchDoc("meta", "clientes", { list: SEED_CLIENTES }),
        fbFetchDoc("meta", "settings", { whatsappNumbers: [{ label: "", number: "" }], pin: "1234", logo: null }),
        fbFetchCollection("wishlists"),
      ]);
      setAddedProducts(Object.values(addedMap));

      // Migración automática: reconecta fotos/precio/qty guardados bajo el id antiguo (basado en fila)
      // con el nuevo id estable del producto, para productos que existían antes de esta actualización.
      let finalOverrides = overridesMap;
      const migrations = [];
      SEED_PRODUCTS.forEach((p) => {
        if (p.legacyId && !overridesMap[p.id] && overridesMap[p.legacyId]) {
          migrations.push({ from: p.legacyId, to: p.id, data: overridesMap[p.legacyId] });
        }
      });
      if (migrations.length > 0) {
        finalOverrides = { ...overridesMap };
        migrations.forEach((mig) => {
          finalOverrides[mig.to] = mig.data;
          delete finalOverrides[mig.from];
          fbSaveDoc("overrides", mig.to, mig.data);
          fbDeleteDoc("overrides", mig.from);
        });
        console.log(`Migradas ${migrations.length} fotos/ajustes de productos a sus nuevos IDs.`);
      }
      setOverrides(finalOverrides);

      setOrders(Object.values(ordersMap));
      setClientes(clientesDoc.list || SEED_CLIENTES);
      setWishlists(Object.values(wishlistsMap));
      const normalizedSettings = { ...settingsDoc };
      if (!normalizedSettings.whatsappNumbers || normalizedSettings.whatsappNumbers.length === 0) {
        normalizedSettings.whatsappNumbers = normalizedSettings.whatsapp ? [{ label: "", number: normalizedSettings.whatsapp }] : [{ label: "", number: "" }];
      }
      setSettings(normalizedSettings);
      setLoaded(true);
    })();
  }, []);

  const allProducts = useMemo(() => {
    const merged = [...SEED_PRODUCTS, ...addedProducts].map((p) => {
      const ov = overrides[p.id];
      if (!ov) return { ...p, visible: true, archived: false, deleted: false };
      return {
        ...p, price: ov.price ?? p.price, qty: ov.qty ?? p.qty,
        visible: ov.visible !== undefined ? ov.visible : true,
        archived: !!ov.archived,
        deleted: !!ov.deleted,
      };
    });
    return merged.filter((p) => !p.deleted);
  }, [addedProducts, overrides]);

  const submitOrder = (items, total, numberChoice) => {
    const order = {
      id: "P" + Date.now().toString().slice(-8),
      createdAt: Date.now(),
      status: "Pendiente",
      discount: 0,
      cliente: `${clientInfo.nombre} ${clientInfo.apellido}`.trim(),
      ciudad: clientInfo.ciudad,
      total,
      paymentProofs: [],
      stockDeducted: false,
      items: items.map(({ product, qty, variantImg }) => ({ id: product.id, code: product.code, diameter: product.diameter, name: product.name, logo: product.logo, color: product.color, price: product.price, qty, variantImg: variantImg || null })),
    };
    fbSaveDoc("orders", order.id, order);
    setOrders((prev) => [...prev, order]);
    setCart({});

    const lines = items.map(({ product, qty }) => `• ${qty}x ${product.code} ${product.name}${product.color && product.color.toUpperCase()!=="NA" ? " ("+product.color+")" : ""} — ${money(product.price*qty)}`);
    const text = `*Pedido Mundo 1/64* #${order.id}\n\n*Cliente:* ${clientInfo.nombre} ${clientInfo.apellido}\n*Ciudad:* ${clientInfo.ciudad}\n\n${lines.join("\n")}\n\n*Total: ${money(total)}*\n\nEstado: pendiente de confirmación de pago.`;
    const phone = (numberChoice || "").replace(/\D/g, "");
    const url = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, "_blank");

    setToast("¡Pedido enviado por WhatsApp!");
    setTimeout(() => setToast(null), 4000);
  };

  if (!loaded) {
    return (
      <div className="m164" style={{ minHeight: 400, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <BrandStyles />
        <div style={{ color: "#9a9994", fontSize: 13 }}>Cargando catálogo...</div>
      </div>
    );
  }

  return (
    <div className="m164" style={{ minHeight: 400, paddingBottom: 30 }}>
      <BrandStyles />
      {view === "client" ? (
        <>
          <ClientCatalog products={allProducts} overrides={overrides} cart={cart} setCart={setCart} whatsappNumbers={settings.whatsappNumbers} onSubmitOrder={submitOrder} logo={settings.logo}
            wishlist={wishlist} setWishlist={setWishlist} clientInfo={clientInfo} setClientInfo={setClientInfo} />
          <div style={{ textAlign: "center", padding: "18px 0" }}>
            <button onClick={() => setShowGate(true)} style={{ background: "none", border: "none", color: "#4a4a4d", fontSize: 11 }}>Acceso administrador</button>
          </div>
        </>
      ) : (
        <AdminView setView={setView} orders={orders} setOrders={setOrders} clientes={clientes} setClientes={setClientes}
          products={allProducts} setAddedProducts={setAddedProducts} overrides={overrides} setOverrides={setOverrides}
          settings={settings} setSettings={setSettings} logo={settings.logo} wishlists={wishlists} setWishlists={setWishlists}
          onLogout={() => { signOut(auth); setView("client"); }} />
      )}
      {showGate && (
        <AdminGate onCancel={() => setShowGate(false)} onSuccess={() => { setView("admin"); setShowGate(false); }} />
      )}
      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#1f1f22", border: "1px solid #e2823c", color: "#f3f1ec", padding: "12px 20px", borderRadius: 10, fontSize: 13, zIndex: 70, boxShadow: "0 6px 20px rgba(0,0,0,0.4)" }}>
          {toast}
        </div>
      )}
      {isAdmin && view === "client" && (
        <div style={{ position: "fixed", bottom: 16, left: 16, zIndex: 40 }}>
          <button onClick={() => setView("admin")} style={{ background: "#1a1a1c", border: "1px solid #2c2c30", color: "#e2823c", borderRadius: 999, padding: "8px 14px", fontSize: 12, display: "flex", alignItems: "center", gap: 6 }}>
            <Settings size={13}/> Panel admin
          </button>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<App />);

</script>
</body>
</html>
